[binaries]
c = ['clang', '--target=aarch64-none-elf', '-fuse-ld=lld']
ld = 'lld'
ar = 'llvm-ar'
strip = 'llvm-strip'
objcopy = 'llvm-objcopy'
nm = 'llvm-nm'
ranlib = 'llvm-ranlib'

[host_machine]
system = 'none'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'

[built-in options]
c_std = 'gnu23'
