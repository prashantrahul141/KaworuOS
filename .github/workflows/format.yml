name: Formatting

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  formatting:
    runs-on: ubuntu-26.04

    steps:
    - name: Checkout repo recursively
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Run clang-format
      uses: jidicula/clang-format-action@v4.18.0
      with:
        clang-format-version: '21'
        check-path: './'
        exclude-regex: '^\.\/thirdparty\/'
